<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Movie World - สำรวจภาพยนตร์และซีรีส์ระดับโลกด้วย React 18 & TVmaze API โทนอบอุ่นสบายตา" />
  <title>Movie World 🎬 | สำรวจจักรวาลภาพยนตร์และซีรีส์</title>

  <!-- Google Fonts: Plus Jakarta Sans & Prompt for warm aesthetic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- React 18 & Babel Standalone (Offline First with CDN Fallback) -->
  <script src="vendor/react.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
    }
  </script>

  <script src="vendor/react-dom.production.min.js"></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <script src="vendor/babel.min.js"></script>
  <script>
    if (!window.Babel) {
      document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <!-- React Mount Root -->
  <div id="root">
    <!-- Initial Loading Fallback before React mounts -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; color: #a69485; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="width: 48px; height: 48px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="font-size: 1.05rem; color: #faf5ef; font-weight: 600;">กำลังเริ่มต้นระบบ Movie World 🎬...</p>
    </div>
  </div>

  <!-- Load App Script -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
